# NOTE: このワークフローは無効化されている（.github/workflows/ に置くと有効になる）。
# 有効化する場合の注意:
# - 外部アクションは可能ならコミット SHA で固定すること（ここではタグで固定している）
# - push イベントのみ。pull_request では自動コミット・push しない
name: fmt

on: [push]

jobs:
  build:
    strategy:
      matrix:
        node: [22]

    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: false
    - name: Please tell me who you are.
      run: |
          git config --global user.email "15198247+buyoh@users.noreply.github.com"
          git config --global user.name "buyoh(workflow)"
    - name: get git submodules
      run: |
        git submodule init
        git submodule update
    - name: install packages
      run: |
        npm ci --ignore-scripts
    - name: lint javascript
      run: |
        npm run lint-fix
    - name: commit phase
      run: |
        if [ `git diff | wc -l` -ne 0 ] ; then
        echo detect diff
        git add .
        git commit -m 'lint-fix by Github Actions'
        fi
    # master ではなくタグで固定する
    - uses: ad-m/github-push-action@v0.8.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
